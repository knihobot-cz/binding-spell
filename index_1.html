<style>
/* Layout: jeden svitek uprostřed tmavého sklepa, svíčky po stranách, jiskry stoupají zespodu. Single dark theme (záměrně). */
:root{
  --night:#0b0807;
  --cellar:#17110d;
  --parchment:#e9dcc0;
  --parchment-deep:#d4c09b;
  --ink:#2a1a12;
  --ink-soft:#5b4232;
  --wax:#7d1620;
  --brand:#264D39;
  --brand-hi:#3a6b52;
  --wax-hi:#a8303a;
  --flame:#f3a54a;
  --ember:#ff7a2e;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --script:"Playfair Display",Georgia,"Times New Roman",serif;
  --label:"Raleway","Helvetica Neue",Arial,sans-serif;
  --body:"Raleway","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--night);color:var(--parchment);
  font-family:var(--body);font-size:17px;line-height:1.6;
  padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 40px) calc(env(safe-area-inset-bottom,0px) + 56px);
  overflow-x:hidden;
}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(60% 45% at 50% 30%, rgba(243,165,74,.10), transparent 70%),
    radial-gradient(120% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.85) 100%);
  animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.82}}

.stage{position:relative;z-index:2;max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:28px}

.brandmark{display:grid;justify-items:center;gap:10px}
.brandmark img{width:150px;height:auto;opacity:.92}
.eyebrow{font-family:var(--label);letter-spacing:.32em;text-transform:uppercase;font-size:.72rem;color:var(--flame);opacity:.85;text-align:center}

/* svíčky */
.candles{display:flex;justify-content:space-between;align-items:flex-end;width:min(100%,560px);margin-bottom:-56px;pointer-events:none}
.candle{position:relative;width:22px;height:96px}
.candle::before{content:"";position:absolute;bottom:0;left:0;width:22px;height:70px;border-radius:3px 3px 1px 1px;
  background:linear-gradient(90deg,#cbb89a,#efe3cc 45%,#b8a283)}
.candle .flame{position:absolute;left:50%;bottom:68px;width:12px;height:26px;margin-left:-6px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 80%,#fff6d8 0 20%,var(--flame) 45%,rgba(255,122,46,.0) 75%);
  filter:blur(.4px);transform-origin:50% 100%;animation:flicker 1.6s infinite alternate}
.candle .glow{position:absolute;left:50%;bottom:50px;width:160px;height:160px;margin-left:-80px;border-radius:50%;
  background:radial-gradient(circle,rgba(243,165,74,.28),transparent 65%);animation:glow 2.4s infinite alternate}
.candle:nth-child(2) .flame{animation-duration:1.3s}
@keyframes flicker{0%{transform:scale(1,1) rotate(-1deg)}30%{transform:scale(.92,1.08) rotate(2deg)}60%{transform:scale(1.05,.95) rotate(-2deg)}100%{transform:scale(.97,1.04) rotate(1deg)}}
@keyframes glow{to{opacity:.6;transform:scale(1.08)}}

/* svitek */
.scroll{position:relative;width:100%;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7))}
.rod{height:22px;border-radius:11px;margin-inline:-10px;position:relative;z-index:2;
  background:linear-gradient(180deg,#4a2e1d,#8a5a35 45%,#3a2216);box-shadow:0 4px 10px rgba(0,0,0,.6)}
.rod::before,.rod::after{content:"";position:absolute;top:-4px;width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#b98a4f,#5a3a22 70%)}
.rod::before{left:-14px}.rod::after{right:-14px}
.paper{position:relative;margin-inline:6px;color:var(--ink);
  padding:clamp(28px,6vw,56px) clamp(22px,6vw,58px) clamp(34px,6vw,60px);
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(80% 50% at 10% 90%,rgba(120,70,30,.22),transparent 70%),
    radial-gradient(70% 40% at 95% 60%,rgba(120,70,30,.18),transparent 70%),
    linear-gradient(180deg,var(--parchment),var(--parchment-deep));
  overflow:hidden;
  transform-origin:top center;animation:unroll 1.6s cubic-bezier(.2,.7,.2,1) both}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 60px rgba(70,35,10,.45), inset 0 0 8px rgba(40,20,5,.5)}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.rod.bottom{animation:drop 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes drop{from{transform:translateY(-40px)}to{transform:none}}
/* ohořelý spodní okraj */
.burn{position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;opacity:.55;
  background:linear-gradient(0deg,rgba(30,12,4,.75),transparent);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 46' preserveAspectRatio='none'><path d='M0 46 L0 26 Q20 14 34 24 T70 18 T110 28 T150 16 T196 26 T238 14 T282 24 T326 12 T366 22 T400 16 L400 46 Z' fill='black'/></svg>") bottom/100% 100% no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 46' preserveAspectRatio='none'><path d='M0 46 L0 26 Q20 14 34 24 T70 18 T110 28 T150 16 T196 26 T238 14 T282 24 T326 12 T366 22 T400 16 L400 46 Z' fill='black'/></svg>") bottom/100% 100% no-repeat}
.smoulder{position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--ember),#ffd08a,var(--ember),transparent);
  filter:blur(2px);opacity:.8;animation:smoulder 3s ease-in-out infinite}
@keyframes smoulder{50%{opacity:.35;transform:scaleX(.9)}}

.paper > *{position:relative;z-index:1}
.paper > .burn,.paper > .smoulder{position:absolute}
.contract-no{font-family:var(--label);letter-spacing:.24em;font-size:.72rem;color:var(--ink-soft);text-align:center;text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-style:italic;text-align:center;line-height:1.02;margin:.35em 0 .1em;
  font-size:clamp(2.3rem,9vw,3.6rem);letter-spacing:.02em;color:#1d0f09;text-wrap:balance}
.sub{font-family:var(--script);font-style:italic;text-align:center;color:var(--brand);font-size:1.1rem;margin:0}
.rule{height:1px;margin:26px auto;width:70%;background:linear-gradient(90deg,transparent,rgba(42,26,18,.55),transparent)}
.story{font-size:1.12rem;max-width:34em;margin:0 auto;text-align:left;text-wrap:pretty}
.story .drop{font-family:var(--display);float:left;font-size:3.4em;line-height:.8;padding:6px 8px 0 0;color:var(--brand)}
.terms{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:10px}
.terms li{display:grid;grid-template-columns:7.5em 1fr;gap:12px;align-items:baseline;border-bottom:1px dotted rgba(42,26,18,.35);padding-bottom:8px}
.terms b{font-family:var(--label);font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--ink-soft)}
.terms span{min-width:0}
.clause{margin:22px 0 0;font-family:var(--script);font-style:italic;text-align:center;color:var(--ink-soft)}

/* volba města */
.cities{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.cities button{font:inherit;font-family:var(--label);letter-spacing:.16em;text-transform:uppercase;font-size:.75rem;
  background:transparent;color:var(--ink-soft);border:1px solid rgba(42,26,18,.4);border-radius:999px;padding:7px 16px;cursor:pointer}
.cities button[aria-pressed="true"]{background:var(--ink);color:var(--parchment);border-color:var(--ink)}

/* formulář */
form{margin-top:30px;display:grid;gap:18px}
.field{display:grid;gap:6px}
label,.legend{font-family:var(--label);letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;color:var(--ink-soft)}
input[type=text],input[type=email],textarea{
  font:inherit;font-size:1.1rem;color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(42,26,18,.55);
  padding:6px 2px;border-radius:0;width:100%}
textarea{resize:vertical;min-height:2.6em}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--brand);box-shadow:0 1px 0 var(--brand)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{display:block;text-transform:none;letter-spacing:0;font-family:var(--script);font-size:1.02rem;color:var(--ink);
  border:1px solid rgba(42,26,18,.45);padding:12px 14px;border-radius:4px;cursor:pointer;text-align:center;line-height:1.25;
  transition:background .2s,border-color .2s,color .2s}
.choice label small{display:block;font-family:var(--body);font-size:.85rem;color:var(--ink-soft);margin-top:2px}
.choice input:checked + label{background:var(--brand);border-color:var(--brand);color:#eef3ec}
.choice input:checked + label small{color:#cfe0d4}
.choice input:focus-visible + label{outline:2px solid var(--brand);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:1rem;color:var(--ink)}
.check input{margin-top:5px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.check label{text-transform:none;letter-spacing:0;font-family:var(--body);font-size:1rem;color:var(--ink)}
.only-yes[hidden]{display:none!important}

.seal-btn{justify-self:center;margin-top:8px;width:132px;height:132px;border-radius:50%;border:0;cursor:pointer;position:relative;
  font-family:var(--label);letter-spacing:.12em;text-transform:uppercase;font-size:.78rem;color:#f6e1cf;line-height:1.2;
  background:radial-gradient(circle at 38% 32%,var(--wax-hi),var(--wax) 55%,#4c0b11);
  box-shadow:0 8px 20px rgba(60,5,10,.45), inset 0 -6px 14px rgba(0,0,0,.35), inset 0 4px 10px rgba(255,255,255,.12);
  clip-path:polygon(50% 0,61% 4%,72% 2%,80% 10%,90% 12%,93% 23%,100% 31%,97% 42%,100% 52%,95% 62%,98% 73%,89% 81%,86% 92%,75% 93%,66% 100%,55% 96%,45% 100%,35% 95%,24% 98%,17% 88%,7% 84%,6% 72%,0 63%,4% 52%,0 41%,6% 31%,8% 20%,18% 15%,24% 5%,35% 6%);
  transition:transform .2s}
.seal-btn:hover{transform:rotate(-4deg) scale(1.03)}
.seal-btn:focus-visible{outline:3px solid var(--flame);outline-offset:6px}
.seal-btn[disabled]{opacity:.6;cursor:wait}
.seal-btn .ring{position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(255,220,200,.35);display:grid;place-items:center;padding:8px}
.err{color:var(--brand);font-style:italic;text-align:center;min-height:1.2em;margin:0}
.privacy{font-size:.85rem;color:var(--ink-soft);text-align:center;margin:0}

/* potvrzení */
.done{text-align:center;display:grid;gap:14px;padding-top:10px}
.done .stamp{font-family:var(--display);font-size:clamp(2rem,8vw,2.8rem);color:var(--brand);letter-spacing:.04em;
  transform:rotate(-6deg);border:3px double var(--brand);padding:6px 18px;justify-self:center;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.done p{margin:0;font-size:1.12rem}
.done .again{font:inherit;font-size:.9rem;background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;justify-self:center}

.foot{font-family:var(--label);letter-spacing:.3em;text-transform:uppercase;font-size:.66rem;color:rgba(233,220,192,.45);text-align:center}
.testmode{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;
  background:#2b1d14;color:var(--flame);font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid rgba(243,165,74,.4)}



/* létající spell jar */
.jar{position:relative;z-index:4;width:104px;margin-bottom:84px;pointer-events:none;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(243,165,74,.25));
  animation:float 6s ease-in-out infinite}
.jar svg{display:block;width:100%;height:auto}
.jar .wisp{position:absolute;left:30%;top:-46px;width:40%;height:60px;opacity:.5;
  background:radial-gradient(ellipse at 50% 100%,rgba(233,220,192,.35),transparent 70%);filter:blur(6px);
  animation:wisp 4s ease-in-out infinite}
@keyframes float{0%{transform:translate(0,0) rotate(8deg)}25%{transform:translate(-6px,-14px) rotate(3deg)}
  50%{transform:translate(-2px,-24px) rotate(-4deg)}75%{transform:translate(4px,-10px) rotate(2deg)}100%{transform:translate(0,0) rotate(8deg)}}
@keyframes wisp{0%{transform:translateY(8px) scaleX(.8);opacity:0}40%{opacity:.5}100%{transform:translateY(-18px) scaleX(1.3);opacity:0}}
.jar-glint{animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,70%,100%{opacity:.15}80%{opacity:.55}}
@media (max-width:480px){.jar{width:84px;margin-bottom:80px}}

@media (max-width:480px){
  body{font-size:16px}
  .terms li{grid-template-columns:1fr;gap:2px}
  .choice{grid-template-columns:1fr}
  .candles{margin-bottom:-60px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

  document.querySelectorAll(".cities button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.city === city)));
}
document.querySelectorAll(".cities button").forEach(b => b.addEventListener("click", () => { city = b.dataset.city; render(); }));
render();

const form = document.getElementById("rsvp");
const err = document.getElementById("err");
form.addEventListener("change", e => {
  if (e.target.name === "attend") {
    const yes = e.target.value === "Ano";
    document.querySelectorAll(".only-yes").forEach(el => el.hidden = !yes);
  }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const t = T[city];
  const attend = form.attend.value;
  const nameEl = document.getElementById("f-name"); const name = nameEl.value.trim();
  if (!attend) { err.textContent = t.errAttend; return; }
  if (!name) { err.textContent = t.errName; nameEl.focus(); return; }
  err.textContent = "";
  const yes = attend === "Ano";
  const f = cfg.fields;
  const data = new URLSearchParams();
  data.append(f.name, name);
  data.append(f.city, cfg.cityValues[city]);
  data.append(f.attend, attend);
  if (yes) {
    const diet = document.getElementById("f-diet").value.trim();
    if (diet) data.append(f.diet, diet);
    data.append(f.photo, document.getElementById("f-photo").checked ? "Ano" : "Ne");
  }

  const btn = document.getElementById("submit");
  btn.disabled = true;
  try {
    if (!testMode) {
      await fetch(cfg.formAction, { method:"POST", mode:"no-cors", body:data });
    } else {
      console.info("Testovací režim, odeslalo by se:", Object.fromEntries(data));
      await new Promise(r => setTimeout(r, 500));
    }
    document.getElementById("stamp").textContent = yes ? t.stampYes : t.stampNo;
    document.getElementById("done-text").textContent = yes ? t.doneYes : t.doneNo;
    form.hidden = true;
    document.getElementById("done").hidden = false;
  } catch (x) {
    err.textContent = t.errSend;
  } finally {
    btn.disabled = false;
  }
});
document.getElementById("again").addEventListener("click", () => {
  document.getElementById("done").hidden = true; form.hidden = false;
});


/* jiskry */
(() => {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const c = document.getElementById("embers"); const ctx = c.getContext("2d");
  let w, h, dpr, parts = [];
  function size(){ dpr = Math.min(window.devicePixelRatio || 1, 2); w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr; }
  size(); addEventListener("resize", size);
  function spawn(){ return { x: Math.random()*w, y: h + Math.random()*h*0.3, r: (Math.random()*1.8+0.6)*dpr,
    vy: -(Math.random()*0.6+0.25)*dpr, vx: (Math.random()-0.5)*0.3*dpr, life: Math.random()*0.5+0.5, t: Math.random()*6 }; }
  for (let i=0;i<55;i++){ const p = spawn(); p.y = Math.random()*h; parts.push(p); }
  function frame(){
    ctx.clearRect(0,0,w,h);
    for (const p of parts){
      p.t += 0.02; p.x += p.vx + Math.sin(p.t)*0.25*dpr; p.y += p.vy;
      const a = Math.max(0, Math.min(1, p.y / h)) * p.life;
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0, `rgba(255,200,120,${a})`); g.addColorStop(0.4, `rgba(255,122,46,${a*0.6})`); g.addColorStop(1, "rgba(255,122,46,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2); ctx.fill();
      if (p.y < -20) Object.assign(p, spawn());
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();
</script>
